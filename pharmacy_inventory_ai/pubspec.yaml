name: pharmacy_inventory_ai
description: 약국 재고관리 앱 - MVP

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태관리
  provider: ^6.1.2

  # 카메라
  camera: ^0.11.0+2


  # 로컬 DB
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # 공유
  share_plus: ^9.0.0

  # UUID
  uuid: ^4.4.0

  # Gemini Vision API
  google_generative_ai: ^0.4.6

  # 런타임 권한 요청
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
